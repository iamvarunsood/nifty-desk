name: fetch-nse
on:
  workflow_dispatch:
  schedule:
    - cron: '5,35 3-9 * * 1-5'   # backup only (UTC): ~08:35–15:05 IST; the Claude task dispatches the real runs
permissions:
  contents: write
concurrency:
  group: fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - run: python tracker/fetch_nse.py
      - run: |
          git config user.name fetch-bot && git config user.email fetch@users.noreply.github.com
          git add data/data.json
          git commit -qm "data $(date -u +%H:%M)" || echo "no change"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break || sleep 5; done
