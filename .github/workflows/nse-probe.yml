name: nse-probe
on:
  schedule:
    - cron: '*/30 3-10 * * 1-5'   # every 30 min, 08:30–16:00 IST, weekdays (UTC in cron)
  workflow_dispatch:
permissions:
  contents: write
concurrency: probe
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - run: python probe/nse_probe.py
      - run: |
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add probe/log.txt && git commit -qm "probe" && git push
